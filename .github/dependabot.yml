version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      flutter-minor-patches:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      server-runtime:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /remote_lab_ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      worker-runtime:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
