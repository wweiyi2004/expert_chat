name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart run drift_dev schema generate drift_schemas test/generated_migrations
      - name: Verify checked-in generated code
        run: git diff --exit-code -- lib/data/db/app_database.g.dart test/generated_migrations
      - run: python scripts/check.py --scope client
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: client-checks-${{ matrix.os }}
          path: |
            output/checks/
            coverage/lcov.info
          retention-days: 14
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.2'
          enable-cache: true
      - run: uv python install 3.12
      - run: uv run --project server --frozen python scripts/check.py --scope server --security
      - name: Build the current document server
        run: docker build -f server/mcp_server/Dockerfile -t expert-chat-mcp:ci server
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: remote_lab_ui/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci --prefix remote_lab_ui --registry=https://registry.npmjs.org
      - run: python scripts/check.py --scope web --security
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python scripts/install_gitleaks.py
      - run: .tools/gitleaks git --redact=100 --log-opts=--all --no-banner
  required:
    if: always()
    needs: [client, server, web, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required checks must succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python -c "import json,os; jobs=json.loads(os.environ['RESULTS']); assert all(j['result']=='success' for j in jobs.values()), jobs"
