name: Sync release to Gitee

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing GitHub release tag, e.g. v3.7.0'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      GITEE_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: gitee-release-${{ github.repository }}-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  mirror:
    if: github.event_name != 'release' || github.event.release.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Run the maintained sync code, while fetching release tags for exact
      # commit mirroring. Do not execute scripts from an old release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Copy release metadata, tag and verified assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: node scripts/sync_gitee_release.mjs
