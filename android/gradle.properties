org.gradle.jvmargs=-Xmx2G -Xss512k -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:ActiveProcessorCount=8 -Djava.util.concurrent.ForkJoinPool.common.parallelism=4 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=4
org.gradle.vfs.watch=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental compilation (fix cross-drive path issue)
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
# Keep Kotlin compilation in the Gradle process to avoid a second large JVM.
kotlin.compiler.execution.strategy=in-process
