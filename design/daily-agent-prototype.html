<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日常 Agent 原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: 顶部切换电脑/手机；电脑 = 侧栏 + 主区 + 检查器，手机 = 单列 + 底部页签 + 底部弹层。
   色彩语义固定：靛蓝 = 助手/主操作，琥珀 = 触发，青绿 = 工具/自动，红 = 需要确认。 */
:root {
  --bg: #F4F5F8; --surface: #FFFFFF; --panel: #EEF0F5; --line: #DDE1E9;
  --ink: #141821; --muted: #5C6574; --faint: #8A92A0;
  --accent: #4D6BFE; --accent-ink: #FFFFFF; --accent-soft: #E7ECFF;
  --trigger: #B86E00; --trigger-soft: #FFF1D9;
  --tool: #0C8573; --tool-soft: #DCF3EE;
  --ask: #C2412D; --ask-soft: #FDE8E4;
  --ok: #1F8A4C; --scrim: rgba(20,24,33,.36);
  --shadow: 0 1px 2px rgba(20,24,33,.06), 0 8px 24px rgba(20,24,33,.07);
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-sm: 8px; --r-md: 12px; --r-lg: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D0F13; --surface: #15181F; --panel: #1B1F28; --line: #2A2F3B;
  --ink: #E8EBF1; --muted: #9BA3B2; --faint: #6D7585;
  --accent: #7D93FF; --accent-ink: #0D0F13; --accent-soft: #222A4A;
  --trigger: #F0AA40; --trigger-soft: #3A2A10;
  --tool: #3FC6AF; --tool-soft: #11322D;
  --ask: #F27A64; --ask-soft: #3B1C17;
  --ok: #4CC27E; --scrim: rgba(0,0,0,.55);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0D0F13; --surface: #15181F; --panel: #1B1F28; --line: #2A2F3B;
  --ink: #E8EBF1; --muted: #9BA3B2; --faint: #6D7585;
  --accent: #7D93FF; --accent-ink: #0D0F13; --accent-soft: #222A4A;
  --trigger: #F0AA40; --trigger-soft: #3A2A10;
  --tool: #3FC6AF; --tool-soft: #11322D;
  --ask: #F27A64; --ask-soft: #3B1C17;
  --ok: #4CC27E; --scrim: rgba(0,0,0,.55);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 14px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
p { margin: 0; }
h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
.mono { font-family: var(--font-mono); font-size: .9em; }
.hint { font-size: 12px; color: var(--muted); }
.spacer { flex: 1; }

/* stage */
.stage-top { max-width: 1320px; margin: 0 auto 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.stage-top b { font-size: 15px; }
.seg { display: inline-flex; background: var(--panel); padding: 3px; border-radius: 999px; }
.seg button { border: 0; background: transparent; padding: 5px 14px; border-radius: 999px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-weight: 500; }
.seg button:disabled { opacity: .4; cursor: not-allowed; }

/* shared atoms */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
button.chip:hover { border-color: var(--faint); }
.c-agent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.c-trigger { background: var(--trigger-soft); color: var(--trigger); border-color: transparent; }
.c-tool { background: var(--tool-soft); color: var(--tool); border-color: transparent; }
.c-ask { background: var(--ask-soft); color: var(--ask); border-color: transparent; }
.c-out { background: var(--panel); color: var(--muted); border-color: transparent; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 6px 12px; font-size: 13px; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 500; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn.small { padding: 3px 9px; font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.avatar { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
.pill { font-size: 11px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.p-ok { background: var(--tool-soft); color: var(--tool); }
.p-wait { background: var(--trigger-soft); color: var(--trigger); }
.p-ask { background: var(--ask-soft); color: var(--ask); }
.p-off { background: var(--panel); color: var(--faint); }
.switch { width: 34px; height: 20px; border-radius: 999px; border: 0; background: var(--line); position: relative; flex: none; padding: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch[aria-checked="true"] { background: var(--tool); }
.switch[aria-checked="true"]::after { left: 16px; }
.tri { display: inline-flex; background: var(--panel); border-radius: 7px; padding: 2px; flex: none; }
.tri button { border: 0; background: transparent; font-size: 11.5px; padding: 2px 8px; border-radius: 5px; color: var(--muted); }
.tri button[aria-pressed="true"][data-v="auto"] { background: var(--tool-soft); color: var(--tool); font-weight: 500; }
.tri button[aria-pressed="true"][data-v="ask"] { background: var(--ask-soft); color: var(--ask); font-weight: 500; }
.tri button[aria-pressed="true"][data-v="off"] { background: var(--surface); color: var(--ink); font-weight: 500; box-shadow: 0 0 0 1px var(--line); }
.field { display: flex; flex-direction: column; gap: 6px; }
.lbl { font-size: 11.5px; color: var(--faint); letter-spacing: .04em; }
.input, .textarea, .select { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 7px 10px; background: var(--surface); width: 100%; font-size: 13px; }
.textarea { resize: vertical; min-height: 64px; line-height: 1.55; }
.perm { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; min-height: 28px; }
.card { background: var(--panel); border-radius: var(--r-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.card-h { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.card-h small { color: var(--muted); font-weight: 400; font-size: 12px; }
.rline { display: flex; align-items: center; gap: 10px; font-size: 13px; min-height: 26px; }
.rline .tm { font-family: var(--font-mono); color: var(--muted); font-size: 12px; width: 40px; font-variant-numeric: tabular-nums; flex: none; }
.rline .pill { margin-left: auto; }
.empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
.view-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.view-h h2 { font-size: 20px; }

/* desktop */
.desk { max-width: 1320px; margin: 0 auto; height: 780px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); display: grid; grid-template-columns: 236px minmax(0,1fr); overflow: hidden; position: relative; }
.desk.with-insp { grid-template-columns: 236px minmax(0,1fr) 312px; }
.side { background: var(--panel); padding: 14px 10px; display: flex; flex-direction: column; gap: 12px; min-width: 0; overflow-y: auto; }
.space { display: flex; align-items: center; gap: 8px; padding: 2px 6px; font-weight: 700; }
.search { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px 10px; color: var(--faint); display: flex; justify-content: space-between; text-align: left; width: 100%; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav button { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: var(--r-sm); border: 0; background: transparent; text-align: left; width: 100%; min-width: 0; }
.nav button:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); }
.nav button.on { background: var(--surface); font-weight: 500; }
.nav button .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.nav .count { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.nav .count.hot { color: var(--ask); }
.ico { width: 16px; text-align: center; color: var(--muted); flex: none; }
.grp { font-size: 11.5px; color: var(--faint); padding: 0 8px; letter-spacing: .04em; display: flex; justify-content: space-between; align-items: center; }
.grp button { border: 0; background: transparent; color: var(--muted); font-size: 15px; padding: 0 4px; }
.side-foot { margin-top: auto; display: flex; gap: 4px; }
.side-foot button { border: 0; background: transparent; color: var(--muted); padding: 4px 8px; border-radius: 6px; font-size: 13px; }
.side-foot button:hover { background: var(--surface); }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.desk.with-insp .main { border-right: 1px solid var(--line); }
.topbar { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--line); min-height: 54px; flex-wrap: wrap; }
.topbar .ttl { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; }
.scroll { flex: 1; overflow-y: auto; min-height: 0; }
.pad { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; max-width: 880px; width: 100%; margin: 0 auto; }
.insp { padding: 16px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; min-width: 0; }
.insp-head { display: flex; align-items: center; gap: 10px; }

/* chat */
.thread { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 660px; margin: 0 auto; padding: 20px 20px 8px; }
.u { align-self: flex-end; background: var(--panel); padding: 8px 14px; border-radius: 16px 16px 4px 16px; max-width: 82%; white-space: pre-wrap; overflow-wrap: anywhere; }
.a { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.who { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.timeline { display: flex; flex-direction: column; gap: 2px; border-left: 2px solid var(--line); padding-left: 12px; margin-left: 3px; }
.step { display: flex; gap: 8px; font-size: 12.5px; color: var(--muted); align-items: baseline; }
.step b { color: var(--ink); font-weight: 500; white-space: nowrap; }
.step .ok { color: var(--ok); }
.step .no { color: var(--ask); }
.typing { color: var(--faint); font-size: 12.5px; }
.typing::after { content: "…"; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.atext { overflow-wrap: anywhere; }
.atext ul { margin: 4px 0; padding-left: 20px; }
.plan { display: grid; grid-template-columns: 56px 1fr; gap: 3px 12px; font-size: 13.5px; }
.plan .tm { font-family: var(--font-mono); color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.approve { border: 1px solid var(--ask); background: var(--ask-soft); border-radius: var(--r-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.approve.done { border-color: var(--line); background: var(--panel); }
.approve .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.approve small { color: var(--muted); }
.approve label { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.welcome { margin: 60px auto 0; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; padding: 0 16px; }
.welcome h2 { font-size: 24px; }
.sugs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.composer-wrap { position: relative; padding: 0 20px 16px; }
.composer { margin: 0 auto; max-width: 660px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.composer textarea { border: 0; background: transparent; resize: none; outline: none; width: 100%; min-height: 24px; max-height: 120px; padding: 2px 4px; line-height: 1.5; }
.composer .bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.send { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); border: 0; display: grid; place-items: center; font-weight: 700; flex: none; }
.send:disabled { opacity: .35; cursor: default; }
.pop { position: absolute; bottom: calc(100% - 8px); left: 50%; transform: translateX(-50%); width: min(660px, calc(100% - 40px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 6px; display: flex; flex-direction: column; gap: 1px; z-index: 5; max-height: 260px; overflow-y: auto; }
.pop button { border: 0; background: transparent; text-align: left; padding: 7px 10px; border-radius: 6px; display: flex; gap: 10px; align-items: center; }
.pop button:hover, .pop button.hi { background: var(--panel); }
.pop .mono { color: var(--accent); min-width: 72px; }

/* today */
.home-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.home-grid .wide { grid-column: 1 / -1; }
.compact .home-grid { grid-template-columns: 1fr; }
.widget-edit { display: flex; gap: 4px; margin-left: auto; }
.widget-edit button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; font-size: 11.5px; padding: 1px 7px; }
.hidden-w { opacity: .45; }
.grid-sk { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.sk { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 6px; text-align: center; font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; align-items: center; }
.sk:hover { border-color: var(--accent); }
.sk i { font-style: normal; font-size: 17px; }
.sk.add { border-style: dashed; color: var(--accent); border-color: var(--accent); }
.bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; align-items: end; height: 110px; padding-top: 6px; }
.bar-c { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; font-size: 11px; color: var(--muted); }
.bar-c .b { width: 100%; max-width: 44px; background: var(--trigger-soft); border-radius: 5px 5px 2px 2px; border-top: 2px solid var(--trigger); }
.bar-c.cur .b { background: var(--trigger); }
.bar-c .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* lists */
.rows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.row-i { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.row-i:last-child { border-bottom: 0; }
.row-i .main-t { display: flex; flex-direction: column; min-width: 0; flex: 1 1 160px; }
.row-i .main-t button { border: 0; background: transparent; padding: 0; text-align: left; font-weight: 500; }
.row-i .main-t button:hover { color: var(--accent); }
.sk-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.sk-card { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); text-align: left; }
.sk-card:hover { border-color: var(--faint); }
.sk-card .top { display: flex; align-items: center; gap: 8px; }
.sk-card .top i { font-style: normal; font-size: 16px; }
.star { border: 0; background: transparent; color: var(--faint); font-size: 16px; padding: 0 2px; margin-left: auto; }
.star[aria-pressed="true"] { color: var(--trigger); }

/* editor */
.canvas { padding: 24px 16px 40px; display: flex; flex-direction: column; align-items: center; background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 18px 18px; min-height: 100%; }
.node { width: min(480px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); }
.node.running { border-color: var(--tool); }
.node .nh { display: flex; align-items: center; gap: 8px; }
.node .nh .tag { font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; flex: none; }
.node input, .node textarea { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 2px 6px; width: 100%; }
.node input { font-weight: 500; }
.node textarea { color: var(--muted); font-size: 13px; resize: vertical; min-height: 40px; }
.node input:hover, .node textarea:hover { border-color: var(--line); }
.node input:focus, .node textarea:focus { border-color: var(--accent); outline: none; background: var(--panel); }
.node .ops { display: flex; gap: 2px; flex: none; }
.node .ops button { border: 0; background: transparent; color: var(--faint); padding: 0 5px; border-radius: 4px; }
.node .ops button:hover { color: var(--ink); background: var(--panel); }
.link { width: 2px; height: 20px; background: var(--line); flex: none; }
.addstep { font-size: 12.5px; color: var(--accent); border: 1px dashed var(--accent); border-radius: 999px; padding: 4px 14px; background: var(--surface); }
.addmenu { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px; box-shadow: var(--shadow); }
.addmenu button { border: 0; }
.log { font-family: var(--font-mono); font-size: 12px; background: var(--panel); border-radius: var(--r-sm); padding: 10px; display: flex; flex-direction: column; gap: 3px; color: var(--muted); min-height: 40px; }
.log .k { color: var(--ok); }
.gen { display: flex; gap: 6px; }

/* phone */
.phone { width: 390px; max-width: 100%; height: 800px; margin: 0 auto; border-radius: 40px; border: 9px solid var(--ink); background: var(--surface); overflow: hidden; display: flex; flex-direction: column; position: relative; font-size: 13.5px; }
.status { display: flex; justify-content: space-between; padding: 10px 22px 2px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); flex: none; }
.pbar { display: flex; align-items: center; gap: 8px; padding: 6px 12px 8px; flex: none; min-height: 48px; }
.pbar .ttl { font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconbtn { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 10px; font-size: 17px; display: grid; place-items: center; flex: none; }
.iconbtn:hover { background: var(--panel); }
.compact .pad { padding: 4px 14px 16px; }
.compact .thread { padding: 8px 14px; }
.compact .composer-wrap { padding: 0 10px 8px; }
.compact .composer { border-radius: 22px; padding: 8px 10px; }
.compact .pop { width: calc(100% - 20px); }
.pinned-approval { padding: 0 10px 8px; flex: none; }
.tabbar { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); padding: 4px 0 14px; flex: none; }
.tabbar button { border: 0; background: transparent; font-size: 11px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 0; padding: 4px 0; position: relative; }
.tabbar button i { font-style: normal; font-size: 17px; line-height: 1.3; }
.tabbar button.on { color: var(--accent); font-weight: 700; }
.tabbar .badge { position: absolute; top: 0; left: calc(50% + 6px); background: var(--ask); color: var(--surface); font-size: 10px; border-radius: 999px; padding: 0 5px; line-height: 16px; }
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 20; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 82%; background: var(--surface); border-radius: 22px 22px 0 0; z-index: 21; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 8px auto 4px; flex: none; }
.sheet .sh { display: flex; align-items: center; padding: 4px 16px 8px; gap: 8px; flex: none; }
.sheet .sb { overflow-y: auto; padding: 0 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.drawer { position: absolute; top: 0; bottom: 0; left: 0; width: 82%; background: var(--panel); z-index: 21; padding: 40px 12px 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
@media (max-width: 520px) {
  body { padding-block: 8px 0; }
  .phone { border: 0; border-radius: 0; height: calc(100dvh - 64px); min-height: 560px; }
  .phone .status { display: none; }
}

    sheet = '<div class="scrim" data-act="closesheet"></div><div class="drawer"><b style="padding:0 8px">对话</b><nav class="nav">' + S.convos.map(function (x) {
      return '<button type="button" class="' + (S.convo === x.id ? 'on' : '') + '" data-act="open" data-id="' + x.id + '">' + dot(agent(x.agent)) + '<span class="t">' + esc(x.title) + '</span></button>';
    }).join('') + '</nav><button class="btn" type="button" data-act="newchat">＋ 新对话</button><span class="spacer"></span><button class="btn ghost" type="button" data-act="go" data-v="today">← 回到今日</button></div>';
  }
  return '<div class="phone compact"><div class="status"><span>9:41</span><span>5G ▮▮▮</span></div>' + bar + body + tabs + sheet + '</div>';
}

/* ---------- render ---------- */
var root = document.getElementById('app');
var stick = false;
function render() {
  var scrolls = {};
  root.querySelectorAll('[data-scroll]').forEach(function (el) { scrolls[el.dataset.scroll] = el.scrollTop; });
  var active = document.activeElement, activeId = active && active.id, selStart = active && active.selectionStart;
  root.innerHTML = S.device === 'desktop' ? desktop() : phone();
  root.querySelectorAll('[data-scroll]').forEach(function (el) {
    if (el.dataset.bottom && stick) el.scrollTop = el.scrollHeight;
    else if (scrolls[el.dataset.scroll] != null) el.scrollTop = scrolls[el.dataset.scroll];
  });
  stick = false;
  if (activeId) {
    var el = document.getElementById(activeId);
    if (el) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch (e) {} }
  }
  autosize();
  document.querySelectorAll('#device-seg button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.dev === S.device));
    if (b.dataset.dev === 'desktop') { b.disabled = window.innerWidth < 900; b.title = b.disabled ? '屏幕太窄，放大窗口后可以看电脑版' : ''; }
  });
  document.querySelectorAll('#theme-seg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.th === theme)); });
}
function autosize() {
  var t = document.getElementById('composer');
  if (t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; }
}
function applyTheme() {
  if (theme === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('da-theme', theme); } catch (e) {}
}
function go(v) { S.view = v; S.sheet = null; S.pop = null; if (v === 'chat') stick = true; render(); }

/* ---------- agent behaviour (scripted) ---------- */
function send(text) {
  text = text.trim();
  if (!text) return;
  var c = convo(S.convo);
  var at = text.match(/^@(\S+)/);
  if (at) {
    var found = S.agents.find(function (a) { return a.name === at[1]; });
    if (found) { c.agent = found.id; text = text.slice(at[0].length).trim() || '你好'; }
  }
  if (!c.msgs.length) c.title = text.slice(0, 16);
  c.msgs.push({ r: 'u', t: (at ? at[0] + ' ' : '') + text });
  var ag = agent(c.agent);
  var msg = { r: 'a', agent: ag.id, steps: [], html: '', typing: true };
  c.msgs.push(msg);
  var plan = [], final = '', approval = null;
  var permOf = function (t) { return ag.perms[t]; };
  var blocked = function (t) {
    var v = permOf(t);
    if (!v) return '<p>' + esc(ag.name) + '没有「' + TOOLS[t] + '」这个工具。可以在右侧配置里加上，或者 @ 一个有这个工具的助手。</p>';
    if (v === 'off') return '<p>「' + TOOLS[t] + '」对' + esc(ag.name) + '是禁止状态，所以我没有动。需要的话，把它改成「询问」或「自动」。</p>';
    return null;
  };
  var sk = text.match(/^\/(\S+)/);
  var s = sk && S.skills.find(function (x) { return x.name === sk[1]; });
  var amount = (text.match(/(\d+(?:\.\d+)?)\s*(?:元|块)?/) || [])[1];

  if (s) {
    s.steps.filter(function (st) { return st.k !== 'trigger' && st.k !== 'ask'; }).forEach(function (st) { plan.push({ l: st.title, t: st.body ? st.body.slice(0, 24) : '完成', ok: true }); });
    var hasAsk = s.steps.some(function (st) { return st.k === 'ask'; });
    final = '<p>已按「' + esc(s.name) + '」跑完 ' + s.steps.length + ' 步。</p>';
    if (hasAsk) approval = { tool: 'notify', title: '「' + s.name + '」的结果，确认后发出', detail: '草稿已生成，批准后按技能里的输出设置发送。', after: '已发出。' };
  } else if (/记一笔|记账|花了|¥|￥/.test(text) && amount) {
    var b = blocked('ledger');
    plan.push({ l: '账本', t: '识别金额 ¥' + amount, ok: !b });
    if (b) final = b;
    else if (permOf('ledger') === 'auto' || +amount <= 200) final = '<p>已记一笔 ¥' + esc(amount) + '。本月累计 ¥' + (5496 + +amount).toLocaleString() + '。</p>';
    else { final = '<p>金额超过 ¥200，先问一下。</p>'; approval = { tool: 'ledger', title: '记一笔：¥' + amount, detail: '写入 资料/记账/2026-10.csv', after: '已记账。' }; }
  } else if (/提醒|日历|日程|会议|组会|安排/.test(text)) {
    var b2 = blocked('calendar');
    plan.push({ l: '日历', t: b2 ? '没有权限' : '查找空闲时间 · 有空', ok: !b2 });
    var ev = text.replace(/^(帮我|请|提醒我)/, '').slice(0, 18);
    if (b2) final = b2;
    else if (permOf('calendar') === 'auto') final = '<p>已在日历里创建「' + esc(ev) + '」，提前 15 分钟提醒。</p>';
    else { final = '<p>找到了合适的时间。</p>'; approval = { tool: 'calendar', title: '创建日历事件「' + ev + '」', detail: '写入「个人」日历，提前 15 分钟提醒', after: '已创建，会提前 15 分钟提醒你。' }; }
  } else if (/查|搜|天气|什么|怎么|为什么|多少|\?|？/.test(text)) {
    var b3 = blocked('browser');
    plan.push({ l: '浏览器', t: b3 ? '没有权限' : '搜索 3 个来源', ok: !b3 });
    final = b3 || '<p>（原型里的回复是预设的）查到了 3 个来源，结论是：周六杭州多云转晴，18–24°C，适合户外。来源放在了「运行记录」里。</p>';
  } else {
    final = '<p>（原型里的回复是预设的）收到。我是' + esc(ag.name) + '，按你给我设的说话方式回答：' + esc(ag.style) + '</p>';
  }

  var k = 0;
  stick = true; S.draft = ''; S.pop = null; render();
  (function tick() {
    if (k < plan.length) { msg.steps.push(plan[k++]); stick = true; render(); setTimeout(tick, 480); return; }
    msg.typing = false; msg.html = final;
    if (approval) { approval.state = 'pending'; msg.approval = approval; }
    stick = true; render();
  })();
}

function decide(cid, i, ok) {
  var c = convo(cid), m = c.msgs[i], a = m.approval;
  var box = document.getElementById('always-' + cid + '-' + i);
  a.state = ok ? 'done' : 'rejected';
  if (ok && box && box.checked) {
    agent(m.agent).perms[a.tool] = 'auto';
    toast('以后' + agent(m.agent).name + '使用「' + TOOLS[a.tool] + '」会自动执行');
  } else toast(ok ? '已批准' : '已拒绝');
  c.msgs.push({ r: 'a', agent: m.agent, steps: [], html: '<p>' + esc(ok ? a.after : '好的，没有执行。需要改的话直接告诉我。') + '</p>' });
  if (S.view === 'chat' && S.convo === cid) stick = true;
  render();
}

function genSteps(text) {
  var steps = [];
  var m = text.match(/每(天|周.|个?月)?\s*(\d{1,2})\s*[点:：]/);
  if (/拍|照片|图片/.test(text)) steps.push({ k: 'trigger', title: '分享图片到 App', body: '' });
  else if (m) steps.push({ k: 'trigger', title: '定时', body: m[0].replace(/[点:：]$/, ' 点') });
  else steps.push({ k: 'trigger', title: '手动', body: '/' + skill(S.editSkill).name });
  if (/天气/.test(text)) steps.push({ k: 'tool', title: '查询天气', body: '当前位置' });
  if (/日程|日历/.test(text)) steps.push({ k: 'tool', title: '读取日历', body: '' });
  steps.push({ k: 'agent', title: '管家 判断', body: text });
  if (/问我|确认|超过/.test(text)) steps.push({ k: 'ask', title: '先问我', body: '' });
  steps.push({ k: 'out', title: /提醒|通知/.test(text) ? '推送通知' : '回复到对话', body: '' });
  return steps;
}

/* ---------- events ---------- */
document.getElementById('device-seg').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b || b.disabled) return;
  S.device = b.dataset.dev; S.sheet = null;
  if (S.device === 'desktop' && S.view === 'me') S.view = 'today';
  try { localStorage.setItem('da-device', S.device); } catch (err) {}
  render();
});
document.getElementById('theme-seg').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  theme = b.dataset.th; applyTheme(); render();
});

root.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  var d = el.dataset, act = d.act;
  switch (act) {
    case 'go': if (d.v === 'chat' && !convo(S.convo)) S.convo = S.convos[0].id; go(d.v); break;
    case 'open': S.convo = d.id; go('chat'); break;
    case 'agent': S.agentView = d.a; go('agent'); break;
    case 'chatwith': newChat(d.a); break;
    case 'newchat': newChat(convo(S.convo).agent); break;
    case 'newagent': {
      var id = 'a' + Date.now();
      S.agents.push({ id: id, name: '新助手', color: COLORS[S.agents.length % COLORS.length], model: MODELS[0], fallback: MODELS[1], style: '写下它该怎么说话、遵守什么规则。', memory: [], perms: { browser: 'ask' }, calls: [] });
      S.agentView = id; go('agent'); toast('已新建助手，改个名字吧'); break;
    }
    case 'switchagent': convo(S.convo).agent = d.a; render(); break;
    case 'perm': agent(d.a).perms[d.t] = d.v; render(); toast(agent(d.a).name + ' · ' + TOOLS[d.t] + '：' + permLabel(d.v)); break;
    case 'addtool': agent(d.a).perms[d.t] = 'ask'; render(); toast('已添加「' + TOOLS[d.t] + '」，默认需要询问'); break;
    case 'unmem': agent(d.a).memory.splice(+d.k, 1); render(); break;
    case 'call': {
      var a = agent(d.a), ix = a.calls.indexOf(d.x);
      if (ix >= 0) a.calls.splice(ix, 1); else a.calls.push(d.x);
      render(); break;
    }
    case 'send': send(S.draft); break;
    case 'suggest': send(d.v); break;
    case 'insert': S.draft = d.v; S.pop = d.v; S.popIndex = 0; render(); focusComposer(); break;
    case 'pick': S.draft = d.v; S.pop = null; render(); focusComposer(); break;
    case 'approve': decide(d.c, +d.i, true); break;
    case 'reject': decide(d.c, +d.i, false); break;
    case 'revise': S.convo = d.c; S.draft = '改一下：'; S.view = 'chat'; stick = true; render(); focusComposer(); break;
    case 'attach': toast('原型里没有接文件选择，正式版支持图片、文件、截图'); break;
    case 'sheet': S.sheet = d.v; render(); break;
    case 'closesheet': S.sheet = null; render(); break;
    case 'edithome': S.editHome = !S.editHome; render(); break;
    case 'wup': case 'wdown': {
      var i = +d.k, j = act === 'wup' ? i - 1 : i + 1;
      if (j >= 0 && j < S.widgets.length) { var t = S.widgets[i]; S.widgets[i] = S.widgets[j]; S.widgets[j] = t; }
      render(); break;
    }
    case 'wtoggle': S.widgets[+d.k].on = !S.widgets[+d.k].on; render(); break;
    case 'runskill': {
      var s = skill(d.id);
      if (s.today) s.today.st = 'done';
      if (!convo(S.convo)) S.convo = S.convos[0].id;
      S.view = 'chat'; S.sheet = null;
      send('/' + s.name);
      break;
    }
    case 'toggleskill': { var s2 = skill(d.id); s2.enabled = !s2.enabled; render(); toast((s2.enabled ? '已启用' : '已暂停') + '「' + s2.name + '」'); break; }
    case 'pin': { var s3 = skill(d.id); s3.pinned = !s3.pinned; render(); toast(s3.pinned ? '已放到首页' : '已从首页移除'); break; }
    case 'edit': S.editSkill = d.id; S.testLog = []; S.testStep = -1; S.addMenu = false; go('editor'); break;
    case 'newskill': {
      var nid = 's' + Date.now();
      S.skills.push({ id: nid, name: '新技能', icon: '✦', trigger: '手动', auto: false, enabled: true, pinned: false, today: null, steps: [{ k: 'trigger', title: '手动', body: '' }, { k: 'agent', title: '管家', body: '' }] });
      S.editSkill = nid; S.testLog = []; S.testStep = -1; S.addMenu = false; go('editor'); break;
    }
    case 'addmenu': S.addMenu = !S.addMenu; render(); break;
    case 'addstep': skill(S.editSkill).steps.push({ k: d.v, title: { trigger: '新触发', tool: '新工具步骤', agent: '管家', ask: '先问我', out: '回复到对话' }[d.v], body: '' }); S.addMenu = false; render(); break;
    case 'stdel': { var st = skill(S.editSkill).steps; if (st.length > 1) st.splice(+d.k, 1); else toast('至少保留一步'); render(); break; }
    case 'stup': { var st2 = skill(S.editSkill).steps, k = +d.k; if (k > 0) { var tmp = st2[k]; st2[k] = st2[k - 1]; st2[k - 1] = tmp; } render(); break; }
    case 'gen': {
      var g = document.getElementById('gen-input');
      if (!g || !g.value.trim()) { toast('先写一句话描述'); break; }
      var sk = skill(S.editSkill);
      sk.steps = genSteps(g.value.trim());
      var tr = sk.steps[0];
      sk.trigger = tr.title === '定时' ? tr.body : tr.title;
      sk.auto = tr.title !== '手动';
      render(); toast('已生成 ' + sk.steps.length + ' 步，可以继续改'); break;
    }
    case 'test': runTest(); break;
    case 'saveskill': toast('已保存「' + skill(S.editSkill).name + '」，电脑和手机同步'); break;
    case 'export': toast('已导出 ' + skill(S.editSkill).name + '.skill（原型不会真的下载）'); break;
    case 'import': toast('正式版可以从文件或链接导入技能'); break;
    case 'connect': toast('连接页：MCP 服务器、HTTP API、远程电脑（原型未展开）'); break;
    case 'search': toast('原型里没有做搜索'); break;
    case 'theme': theme = { system: 'light', light: 'dark', dark: 'system' }[theme]; applyTheme(); render(); toast('外观：' + { system: '跟随系统', light: '浅色', dark: '深色' }[theme]); break;
  }
});

function newChat(aid) {
  var id = 'c' + Date.now();
  S.convos.unshift({ id: id, title: '新对话', agent: aid, msgs: [] });
  S.convo = id; go('chat'); focusComposer();
}
function focusComposer() { var t = document.getElementById('composer'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }

function runTest() {
  var s = skill(S.editSkill);
  S.testing = true; S.testLog = []; S.testStep = 0; render();
  var k = 0;
  (function tick() {
    if (k < s.steps.length) {
      var st = s.steps[k];
      S.testStep = k;
      S.testLog.push(st.k === 'ask' ? '… ' + esc(st.title) + '（测试中自动跳过）' : '<span class="k">✓</span> ' + KIND[st.k].name + ' · ' + esc(st.title));
      k++; render(); setTimeout(tick, 420); return;
    }
    S.testLog.push('<span class="k">✓</span> 完成 · 1,820 tokens · ¥0.03');
    S.testing = false; S.testStep = -1; render();
  })();
}

root.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'composer') {
    S.draft = t.value;
    var first = t.value.charAt(0);
    var newPop = (first === '/' || first === '@') && t.value.indexOf(' ') < 0 ? first : null;
    S.popIndex = 0;
    if (newPop !== S.pop || newPop) { S.pop = newPop; render(); }
    else { autosize(); var b = root.querySelector('.send'); if (b) b.disabled = !S.draft.trim(); }
    return;
  }
  if (t.dataset.stf) { skill(S.editSkill).steps[+t.dataset.k][t.dataset.stf] = t.value; return; }
  if (t.dataset.skf) { skill(S.editSkill).name = t.value || '未命名'; return; }
  if (t.dataset.agf === 'style') { agent(t.dataset.a).style = t.value; return; }
});
root.addEventListener('change', function (e) {
  var t = e.target;
  if (t.dataset.agf) { agent(t.dataset.a)[t.dataset.agf] = t.value || agent(t.dataset.a)[t.dataset.agf]; render(); }
  if (t.dataset.skf) render();
});
root.addEventListener('keydown', function (e) {
  var t = e.target;
  if (t.id === 'composer') {
    var items = S.pop ? popItems() : [];
    if (items.length && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault();
      S.popIndex = (S.popIndex + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length; render(); return;
    }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      if (items.length) { S.draft = items[S.popIndex].v; S.pop = null; render(); focusComposer(); }
      else send(S.draft);
    }
    if (e.key === 'Escape' && S.pop) { S.pop = null; render(); }
    return;
  }
  if (t.dataset.mem && e.key === 'Enter' && !e.isComposing && t.value.trim()) {
    agent(t.dataset.mem).memory.push(t.value.trim()); t.value = ''; render(); toast('记住了');
  }
  if (t.id === 'gen-input' && e.key === 'Enter' && !e.isComposing) { var g = root.querySelector('[data-act="gen"]'); if (g) g.click(); }
});
window.addEventListener('resize', function () {
  if (window.innerWidth < 900 && S.device === 'desktop') S.device = 'phone';
  render();
});

applyTheme();
stick = true;
render();
})();
</script>
