<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expert Chat 新版原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: 电脑 = 侧栏（项目/会话 + 自动化/资料库/设置）+ 对话 + 工作台检查器；
   手机 = 对话为主，☰ 抽屉放同一份侧栏，工作台变底部弹层。
   色彩语义：靛蓝 = 主操作/助手，青绿 = 自动/完成，琥珀 = 触发/运行中，红 = 需要确认。 */
:root {
  --bg: #F4F5F8; --surface: #FFFFFF; --panel: #EEF0F5; --line: #DDE1E9;
  --ink: #141821; --muted: #5C6574; --faint: #8A92A0;
  --accent: #4D6BFE; --accent-ink: #FFFFFF; --accent-soft: #E7ECFF;
  --trigger: #B86E00; --trigger-soft: #FFF1D9;
  --tool: #0C8573; --tool-soft: #DCF3EE;
  --ask: #C2412D; --ask-soft: #FDE8E4;
  --ok: #1F8A4C; --add: #1F8A4C; --add-soft: #E3F5EA; --del: #C2412D; --del-soft: #FCE9E6;
  --term-bg: #10131A; --term-ink: #D7DEE8; --user-bg: #EEF0F5; --input: #F3F4F6;
  --scrim: rgba(20,24,33,.36);
  --shadow: 0 1px 2px rgba(20,24,33,.06), 0 8px 24px rgba(20,24,33,.07);
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-sm: 8px; --r-md: 12px; --r-lg: 18px;
  /* 间距按 8 的倍数，动效 150–250ms，退出比进入短 */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-6: 24px; --s-8: 32px;
  --ease: cubic-bezier(.2, 0, 0, 1); --dur-fast: 150ms; --dur-base: 200ms;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D0F13; --surface: #15181F; --panel: #1B1F28; --line: #2A2F3B;
  --ink: #E8EBF1; --muted: #9BA3B2; --faint: #6D7585;
  --accent: #7D93FF; --accent-ink: #0D0F13; --accent-soft: #222A4A;
  --trigger: #F0AA40; --trigger-soft: #3A2A10;
  --tool: #3FC6AF; --tool-soft: #11322D;
  --ask: #F27A64; --ask-soft: #3B1C17;
  --ok: #4CC27E; --add: #5BD08C; --add-soft: #14301F; --del: #F27A64; --del-soft: #3B1C17;
  --term-bg: #07090D; --term-ink: #D7DEE8; --user-bg: #232733; --input: #26262A;
  --scrim: rgba(0,0,0,.55);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0D0F13; --surface: #15181F; --panel: #1B1F28; --line: #2A2F3B;
  --ink: #E8EBF1; --muted: #9BA3B2; --faint: #6D7585;
  --accent: #7D93FF; --accent-ink: #0D0F13; --accent-soft: #222A4A;
  --trigger: #F0AA40; --trigger-soft: #3A2A10;
  --tool: #3FC6AF; --tool-soft: #11322D;
  --ask: #F27A64; --ask-soft: #3B1C17;
  --ok: #4CC27E; --add: #5BD08C; --add-soft: #14301F; --del: #F27A64; --del-soft: #3B1C17;
  --term-bg: #07090D; --term-ink: #D7DEE8; --user-bg: #232733; --input: #26262A;
  --scrim: rgba(0,0,0,.55);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 14px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
p { margin: 0; }
h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
.mono { font-family: var(--font-mono); font-size: .9em; }
.hint { font-size: 12px; color: var(--muted); }
.spacer { flex: 1; }

.stage-top { max-width: 1360px; margin: 0 auto 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.stage-top b { font-size: 15px; }
.seg { display: inline-flex; background: var(--panel); padding: 3px; border-radius: 999px; }
.seg button { border: 0; background: transparent; padding: 6px 16px; border-radius: 999px; color: var(--muted); transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease), box-shadow var(--dur-base) var(--ease); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-weight: 500; }
.seg button:disabled { opacity: .4; cursor: not-allowed; }

/* atoms */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
button.chip:hover { border-color: var(--faint); }
.c-accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.c-trigger { background: var(--trigger-soft); color: var(--trigger); border-color: transparent; }
.c-tool { background: var(--tool-soft); color: var(--tool); border-color: transparent; }
.c-ask { background: var(--ask-soft); color: var(--ask); border-color: transparent; }
.c-mute { background: var(--panel); color: var(--muted); border-color: transparent; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 7px 14px; font-size: 13px; transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease); }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 500; }
.btn.danger { color: var(--ask); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn.small { padding: 3px 9px; font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.pill { font-size: 11px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.p-ok { background: var(--tool-soft); color: var(--tool); }
.p-run { background: var(--trigger-soft); color: var(--trigger); }
.p-ask { background: var(--ask-soft); color: var(--ask); }
.p-off { background: var(--panel); color: var(--faint); }
.switch { width: 34px; height: 20px; border-radius: 999px; border: 0; background: var(--line); position: relative; flex: none; padding: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch[aria-checked="true"] { background: var(--tool); }
.switch[aria-checked="true"]::after { left: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.lbl { font-size: 11.5px; color: var(--faint); letter-spacing: .04em; }
.input, .textarea, .select { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 7px 10px; background: var(--surface); width: 100%; font-size: 13px; }
.textarea { resize: vertical; min-height: 64px; line-height: 1.55; }
.card { background: var(--panel); border-radius: var(--r-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card-h { display: flex; align-items: center; gap: 8px; font-weight: 500; flex-wrap: wrap; }
.card-h small { color: var(--muted); font-weight: 400; font-size: 12px; }
.kv { display: flex; align-items: center; gap: 10px; font-size: 13px; min-height: 30px; }
.kv > span:first-child { flex: 1; min-width: 0; }
.rows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
.row-i { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; min-width: 0; }
.row-i:last-child { border-bottom: 0; }
.row-i .t { display: flex; flex-direction: column; min-width: 0; flex: 1 1 160px; }
.view-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.view-h h2 { font-size: 20px; }
.empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
.tabs button { border: 0; background: transparent; padding: 8px 12px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-size: 13px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
.tabs .n { font-family: var(--font-mono); font-size: 11px; margin-left: 4px; color: var(--faint); }

/* desktop frame */
.desk { max-width: 1360px; margin: 0 auto; height: 800px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); display: grid; grid-template-columns: 252px minmax(0,1fr); overflow: hidden; position: relative; }
.desk.with-insp { grid-template-columns: 252px minmax(0,1fr) 10px var(--insp-w, 560px); }
.desk.insp-max { grid-template-columns: 252px minmax(0,1fr); }
.desk.insp-max > .main, .desk.insp-max > .pane-handle { display: none; }
.desk.with-insp .main { border-right: 0; }
.pane-handle { position: relative; cursor: col-resize; background: var(--panel); touch-action: none; transition: background var(--dur-fast) var(--ease); }
.pane-handle::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--line); transform: translateX(-50%); }
.pane-handle::after { content: ""; position: absolute; top: 50%; left: 50%; width: 4px; height: 38px; border-radius: 4px; background: var(--faint); transform: translate(-50%, -50%); opacity: .7; }
.pane-handle:hover, .pane-handle.dragging, .pane-handle:focus-visible { background: var(--accent-soft); outline: none; }
.pane-handle:hover::before, .pane-handle.dragging::before, .pane-handle:focus-visible::before { background: var(--accent); }
.pane-handle:hover::after, .pane-handle.dragging::after, .pane-handle:focus-visible::after { background: var(--accent); opacity: 1; }
body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }
.side { background: var(--panel); padding: 12px 10px; display: flex; flex-direction: column; gap: 10px; min-width: 0; overflow: hidden; }
.side-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 6px; }
.side-foot { flex: none; }
.logo-img { width: 26px; height: 26px; border-radius: 7px; display: block; flex: none; }
/* 运行中：旋转弧线；提问：慢速呼吸点；新完成：静态点 */
.ind.run { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--trigger-soft); border-top-color: var(--trigger); animation: spin .8s linear infinite; box-sizing: border-box; display: inline-block; }
.ind.ask { animation: breathe 1.8s ease-in-out infinite; display: inline-block; }
.ind.new { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 50% { opacity: .35; transform: scale(.75); } }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
/* 子代理状态胶囊 */
.sub-st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 10px 2px 7px; border-radius: 999px; flex: none; white-space: nowrap; }
.sub-st i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; box-sizing: border-box; flex: none; }
.sub-st.run { background: var(--trigger-soft); color: var(--trigger); }
.sub-st.run i { border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
.sub-st.wait { background: var(--panel); color: var(--muted); }
.sub-st.wait i { border: 1.5px dashed currentColor; animation: spin 4s linear infinite; }
.sub-st.done { background: var(--tool-soft); color: var(--tool); }
.sub-st.done i { width: auto; height: auto; border: 0; font-style: normal; font-size: 11px; font-weight: 700; animation: pop .3s var(--ease); }
.step .s.rn { display: inline-block; animation: spin .8s linear infinite; }
/* 文件行：路径 + 两个操作 */
.frow { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 12px; border-top: 1px solid var(--line); background: var(--surface); font-size: 12.5px; min-width: 0; }
.frow .pth { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frow .btn.small { padding: 3px 9px; white-space: nowrap; }
/* 配色 */
.color-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
.sw { border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; text-align: left; transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); }
.sw:hover { border-color: var(--faint); }
.sw[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.sw .chips { display: flex; height: 16px; border-radius: 5px; overflow: hidden; }
.sw .chips i { flex: 1; }
.custom-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.custom-row input[type=color] { width: 40px; height: 28px; border: 0; background: none; padding: 0; cursor: pointer; }
.brand { display: flex; align-items: center; gap: 8px; padding: 2px 6px; font-weight: 700; }
.logo-unused { width: 26px; height: 26px; border-radius: 8px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.side-actions { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.search { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px 10px; color: var(--faint); display: flex; justify-content: space-between; text-align: left; width: 100%; min-width: 0; }
.newbtn { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px 10px; font-weight: 500; display: flex; gap: 6px; align-items: center; justify-content: center; }
.newbtn:hover, .search:hover { border-color: var(--faint); }
.grp { display: flex; align-items: center; gap: 6px; padding: 6px 8px 2px; font-size: 12px; color: var(--muted); }
.grp button.g { border: 0; background: transparent; padding: 0; display: flex; gap: 6px; align-items: center; color: var(--muted); font-weight: 500; min-width: 0; flex: 1; text-align: left; }
.grp button.g span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grp .add { border: 0; background: transparent; color: var(--faint); padding: 0 4px; font-size: 15px; }
.grp .add:hover { color: var(--ink); }
.loc-ico { font-family: var(--font-mono); font-size: 10.5px; padding: 0 5px; border-radius: 4px; background: var(--surface); color: var(--muted); flex: none; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav button { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--r-sm); border: 0; background: transparent; text-align: left; width: 100%; min-width: 0; transition: background var(--dur-fast) var(--ease); }
.nav button:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); }
.nav button.on { background: var(--surface); font-weight: 500; }
.nav button.last { background: color-mix(in srgb, var(--surface) 55%, transparent); }
/* 回到对话：电脑放在顶栏，手机放在底部 */
.resume { display: flex; align-items: center; gap: 10px; min-width: 0; max-width: 520px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 14px 5px 10px; text-align: left; transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease); }
.resume:hover { border-color: var(--accent); }
.resume .back { color: var(--muted); flex: none; }
.resume .rt { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.resume .rt b { font-weight: 500; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.resume .rt span { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.resume.ask { border-color: color-mix(in srgb, var(--ask) 40%, var(--line)); }
.resume.ask .rt span { color: var(--ask); }
.resume .ind { flex: none; }
.ind.idle { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; }
.ind.done { color: var(--tool); font-size: 12px; font-weight: 700; display: inline-block; }
.others { border: 0; background: transparent; color: var(--muted); font-size: 12px; padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
.others:hover { background: var(--panel); color: var(--ink); }
.mini { flex: none; display: flex; align-items: center; gap: 8px; margin: 0 10px 10px; padding: 8px 8px 8px 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.mini .resume { flex: 1; border: 0; padding: 2px 0; max-width: none; background: transparent; border-radius: 10px; }
.mini .go { flex: none; border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 7px 14px; font-size: 12.5px; font-weight: 500; }
.nav button .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.nav .ind { font-size: 11px; flex: none; }
.ind.ask { color: var(--ask); } .ind.run { color: var(--trigger); } .ind.new { color: var(--accent); }
.side-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 8px; }
.side-foot .count { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--ask); }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.topbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); min-height: 52px; flex: none; }
.topbar .ttl { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.scroll { flex: 1; overflow-y: auto; min-height: 0; }
.pad { padding: 20px 24px 32px; display: flex; flex-direction: column; gap: 16px; max-width: 900px; width: 100%; margin: 0 auto; }

/* chat */
.thread { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 700px; margin: 0 auto; padding: 20px 20px 8px; }
.u { align-self: flex-end; background: var(--user-bg); padding: 8px 14px; border-radius: 16px 16px 4px 16px; max-width: 82%; white-space: pre-wrap; overflow-wrap: anywhere; }
.a { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.who { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.timeline { display: flex; flex-direction: column; gap: 2px; border-left: 2px solid var(--line); padding-left: 12px; margin-left: 3px; }
.step { display: flex; gap: 8px; font-size: 13px; color: var(--muted); align-items: baseline; min-width: 0; }
.step b { color: var(--ink); font-weight: 500; white-space: nowrap; }
.step .s { flex: none; }
.step .ok { color: var(--ok); } .step .no { color: var(--ask); } .step .rn { color: var(--trigger); }
.step .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.typing { color: var(--faint); font-size: 12.5px; }
.typing::after { content: "…"; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.atext { overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 6px; }
.atext ul { margin: 0; padding-left: 20px; }
.atext code { font-family: var(--font-mono); font-size: 12.5px; background: var(--panel); padding: 0 4px; border-radius: 4px; }
.cites { display: flex; gap: 6px; flex-wrap: wrap; }
.deliv { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.deliv-h { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); font-size: 12.5px; flex-wrap: wrap; }
.deliv button.f { display: flex; width: 100%; gap: 8px; align-items: center; padding: 6px 12px; border: 0; border-top: 1px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-size: 12px; text-align: left; min-width: 0; }
.deliv button.f:hover { background: var(--panel); }
.deliv .pth { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.plus { color: var(--add); } .minus { color: var(--del); }
.approve { border: 1px solid color-mix(in srgb, var(--ask) 30%, transparent); background: var(--ask-soft); border-radius: var(--r-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.approve.done { border-color: var(--line); background: var(--panel); padding: 8px 12px; }
.approve .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.approve small { color: var(--muted); }

  if (!drag || (e && e.pointerId !== drag.id)) return;
  drag.h.classList.remove('dragging'); document.body.classList.remove('resizing');
  drag = null; setInspW(S.inspW, true);
}
root.addEventListener('pointerup', endDrag);
root.addEventListener('pointercancel', endDrag);
root.addEventListener('dblclick', function (e) {
  if (!e.target.closest('.pane-handle')) return;
  setInspW(INSP_DEFAULT, true); toast('工作台宽度已恢复默认');
});
root.addEventListener('keydown', function (e) {
  if (!e.target.classList || !e.target.classList.contains('pane-handle')) return;
  var step = e.shiftKey ? 64 : 16;
  if (e.key === 'ArrowLeft') { e.preventDefault(); setInspW(inspWidth() + step, true); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); setInspW(inspWidth() - step, true); }
  else if (e.key === 'Home') { e.preventDefault(); setInspW(INSP_MIN, true); }
  else if (e.key === 'End') { e.preventDefault(); setInspW(inspMaxW(), true); }
});
window.addEventListener('resize', function () {
  if (window.innerWidth < 900 && S.device === 'desktop') S.device = 'phone';
  render();
});

applyTheme();
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { applyPalette(); });
stick = true;
render();
})();
</script>
