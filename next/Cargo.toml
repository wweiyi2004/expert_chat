[workspace]
members = ["desktop", "tui"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
cap-std = "4.0.3"
cap-tempfile = "4.0.3"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4.3"
rmcp = { version = "3.6.0", features = ["transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
