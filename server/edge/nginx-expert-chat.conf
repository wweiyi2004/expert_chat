limit_req_zone $binary_remote_addr zone=expert_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=expert_login:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=expert_token:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=expert_upload:10m rate=12r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 125.208.22.148;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 125.208.22.148;

    ssl_certificate /etc/letsencrypt/live/125.208.22.148/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/125.208.22.148/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ExpertTLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 55m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /gateway {
        return 308 /gateway/;
    }

    location = /gateway/v1/files {
        limit_req zone=expert_upload burst=4 nodelay;
        proxy_pass http://127.0.0.1:8790/v1/files;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10m;
        proxy_read_timeout 10m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /gateway/ {
        limit_req zone=expert_general burst=80 nodelay;
        proxy_pass http://127.0.0.1:8790/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10m;
        proxy_read_timeout 10m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/v1/auth/login {
        limit_req zone=expert_login burst=5 nodelay;
        try_files /__expert_chat_proxy__ @authservice;
    }

    location = /api/v1/auth/register {
        limit_req zone=expert_login burst=3 nodelay;
        try_files /__expert_chat_proxy__ @authservice;
    }

    location = /connect/token {
        limit_req zone=expert_token burst=20 nodelay;
        try_files /__expert_chat_proxy__ @authservice;
    }

    location / {
        limit_req zone=expert_general burst=80 nodelay;
        try_files /__expert_chat_proxy__ @authservice;
    }

    location @authservice {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
