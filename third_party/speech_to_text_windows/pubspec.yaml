name: speech_to_text_windows
description: >-
  Windows SAPI implementation of speech_to_text (Expert Chat patch: SetInterest
  + shared recognizer so dictation actually returns text).
version: 1.0.1+expert.1
homepage: https://github.com/csdcorp/speech_to_text

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

flutter:
  plugin:
    implements: speech_to_text
    platforms:
      windows:
        pluginClass: SpeechToTextWindows
        dartPluginClass: SpeechToTextWindows

dependencies:
  flutter:
    sdk: flutter
  speech_to_text_platform_interface: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0